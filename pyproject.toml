[project]
name = "deepsearch-mcp"
version = "0.1.0"
description = "LLM-specialized DuckDuckGo MCP Server for Deep Research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "duckduckgo-search>=7.0.0",
    "trafilatura>=2.0.0",
    "curl-cffi>=0.7.0",
    "pydantic>=2.0.0",
    "dateparser>=1.2.0",
    "readability-lxml>=0.8.1",
    "markdownify>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0", # HTTPモック用
    "ruff>=0.8.0",   # リンター・フォーマッター
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepsearch_mcp"]

# --- ツール設定（AIに守らせるルール） ---

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"] # コードの自動整形やインポート順のルール

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]   # HTML fixture strings in tests may exceed line limit
"evals/*" = ["E501"]   # Demo data strings and report formatters may exceed line limit